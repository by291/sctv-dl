name: Desktop validation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'server/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'tooling/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.gitattributes'
      - 'index.html'
      - 'vite.config.*'
      - 'vitest.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-release.yml'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'server/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'tooling/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.gitattributes'
      - 'index.html'
      - 'vite.config.*'
      - 'vitest.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-release.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - name: Record toolchain
        run: |
          rustc --version
          node --version
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:desktop
      - name: Check Rust 1.90 minimum
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal --no-self-update
          cargo +1.90.0 check --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - run: pnpm desktop:check
      - name: Check Windows signing lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tooling/windows-signing.test.ps1
      - name: Build validation packages
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Check Windows installer cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tooling/check-windows-installer.ps1
      - name: Upload validation packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

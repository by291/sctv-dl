name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.editorconfig', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
    paths: ['android/**', '.editorconfig', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install stable Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Check and assemble
        run: |
          ./android/gradlew -p android spotlessCheck check :app:assembleDebug :baselineprofile:assemble :benchmark:assemble --no-daemon
      - name: Assemble release APKs per ABI
        run: |
          ./android/gradlew -p android :app:assembleRelease -PsplitPerAbi=true --no-daemon
          for abi in armeabi-v7a arm64-v8a x86_64; do
            test -s "android/app/build/outputs/apk/release/app-${abi}-release-unsigned.apk"
          done
      - name: Preserve APKs and verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/**/build/reports/**
          retention-days: 14

  dependency-submission:
    name: Submit Android dependency graph
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install stable Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        env:
          # The release app includes runtime dependencies from all shipped modules.
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_PROJECTS: '^:app$'
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: '^releaseRuntimeClasspath$'
        with:
          build-root-directory: android
          dependency-graph: generate-and-submit
          additional-arguments: --no-daemon --no-configuration-cache
          validate-wrappers: true

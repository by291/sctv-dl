name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.editorconfig', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
    paths: ['android/**', '.editorconfig', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install stable Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Check and assemble
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android spotlessCheck check :app:assembleDebug :app:assembleRelease :baselineprofile:assemble :benchmark:assemble --no-daemon
      - name: Preserve APKs and verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/**/build/reports/**
          retention-days: 14

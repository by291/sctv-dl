identifier = "download-api"
description = "Allows the local main window to manage native programme downloads and select their directory."
commands.allow = ["get_download_snapshot", "subscribe_download_events", "unsubscribe_download_events", "act_on_download", "open_local_playback", "start_downloads", "list_downloads", "subscribe_downloads", "unsubscribe_downloads", "cancel_download", "get_download_directory", "choose_download_directory"]

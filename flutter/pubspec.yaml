name: sctv_dl_mobile
description: Native Flutter client for browsing, playing and downloading Sichuan TV programmes.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.6'

dependencies:
  audio_session: ^0.2.4
  background_downloader: ^9.6.4
  cached_network_image: ^4.0.4
  cupertino_icons: ^2.0.0
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  drift: ^2.35.2
  dynamic_color: ^2.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  http: ^1.6.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pip_kit: 1.0.2
  share_plus: ^13.3.1
  sliver_tools: ^0.2.12
  uuid: ^4.6.0
  video_player: ^2.14.1
  wakelock_plus: ^1.8.1

dev_dependencies:
  analyzer: ^14.5.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  video_player_platform_interface: ^6.9.0
  wakelock_plus_platform_interface: ^1.7.0

flutter:
  uses-material-design: true
